[tools]
node = "24.21.0"

[tasks.install]
description = "Install dependencies from package-lock.json"
run = "npm ci"

[tasks.build]
description = "Build the graduate schemes website"
run = "npm run build"

[tasks.test-a11y]
description = "Build the site and run automated accessibility tests"
run = "npm run test:a11y"

[tasks.check-links]
description = "Check links in README.md"
run = "npm run check-links"
